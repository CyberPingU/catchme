name: catchme
description: "Proximity chat app using Bluetooth"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.5
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  flutter_background: ^1.3.1
  web_socket_channel: ^3.0.1
  geolocator: ^12.0.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.3
  unifiedpush: ^6.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"

flutter:
  uses-material-design: true
