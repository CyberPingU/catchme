name: Release FOSS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-foss:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Clean build cache
        run: flutter clean

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/catchme-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=catchme
          storeFile=../catchme-release.jks
          EOF
      - name: Build FOSS APK
        run: |
          flutter build apk \
            --release \
            --flavor fdroid \
            --dart-define=PUSH_PROVIDER=unifiedpush
          mv build/app/outputs/flutter-apk/app-fdroid-release.apk \
             build/app/outputs/flutter-apk/catchme-foss-${{ github.ref_name }}.apk
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/catchme-foss-*.apk
          generate_release_notes: true
